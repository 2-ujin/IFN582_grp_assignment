<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MakeArtsFund | Fund the Art, Make a Start{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <!-- Nav header -->
        <nav class="navbar navbar-expand-lg site-navbar" aria-label="Primary navigation">
          <div class="container">
            <a class="navbar-brand brand-mark" href="{{ url_for('main.index') }}">Make<span>Arts</span>Fund</a>
    
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse" id="mainNav">
              <form class="search-form mx-lg-auto my-3 my-lg-0" role="search" method="GET" >
                <label class="visually-hidden" for="project-search">Search creative projects</label>
                <input id="project-search" name="project-search" class="form-control" type="search" placeholder="Search projects" aria-label="Search creative projects">
                <button class="btn btn-search" type="submit">Search</button>
              </form>
    
              <ul class="navbar-nav ms-lg-3 align-items-lg-center header-actions">
                <li class="nav-item">
                  <label class="visually-hidden" for="language-select">Language</label>
                  <select id="language-select" class="header-select" aria-label="Language">
                    <option>English</option>
                    <option>中文</option>
                  </select>
                </li>
                <li class="nav-item">
                  <label class="visually-hidden" for="currency-select">Currency</label>
                  <select id="currency-select" class="header-select" aria-label="Currency">
                    <option>AUD $</option>
                    <option>USD $</option>
                    <option>HKD $</option>
                  </select>
                </li>
                <li class="nav-item">
                  <a class="btn btn-outline-coral sign-in-button" href="#">Sign In</a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </header>

      <main id="main-content">
        {% block content %}
        {% endblock %}
      </main>

       <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-links-only">
        <a href="#">About</a>
        <a href="#">Contact Us</a>
        <a href="#">Terms</a>
        <a href="#">Press</a>
      </div>
      <hr>
      <p class="copyright mb-0">© 2026 MakeArtsFund.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
